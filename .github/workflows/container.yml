name: Publish container

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for smoke check
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: jev-dungeon:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, health, and shutdown without paid calls
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f container-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name container-check --init -e JEV_TEST_STUB=1 jev-dungeon:check
          docker exec container-check node --input-type=module -e '
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3100/health");
                if (response.ok) process.exit(0);
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            process.exit(1);
          '
          docker stop --timeout 30 container-check
          test "$(docker inspect --format '{{.State.ExitCode}}' container-check)" = 0
      - name: Publish checked image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
