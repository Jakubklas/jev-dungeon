  logMax: 12 # Event log length, lines
  fadeMs: 300 # Time for a newly lit cell to reach its brightness, ms
  tweenMs: 150 # Entity move tween, ms
  bobMs: 1600 # Ghost hover period, ms
  animMs: 260 # Idle animation frame time, ms
  walkMs: 620 # A troll's stride after each step, ms
  strikeMs: 800 # Strike overlay duration, ms
  slashMs: 340 # Slash crescent duration, ms
  revealAlpha: 0.42 # Opacity of cells and monsters shown by Reveal map
  bubbleIn: 200 # Thought bubble fade-in, ms
