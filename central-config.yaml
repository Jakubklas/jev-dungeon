# Defaults of the small test arenas (gyms).
testbed:
  size:
    w: 11 # Default arena width, floor cells
    h: 11 # Default arena height, floor cells
  seed: 1 # Default arena seed
  numAdversaries: 1 # Default monsters per arena
  minAdversaryGap: 4 # Default least path distance of a random monster from the start
  props: none # Default prop preset: none, few or many

# Per-instance overrides, same shape as everything above. Names: arena, gym (every instance of that kind),
# arena/main, gym/main, arena/a1, ... Example:  arena/main: { explorer: { lives: 4 } }
instances:
  arena/main:
    monsters:
      global:
        speed: 1
        clawCooldown: 0
      spawn:
        max: 8
    player:
      cooldownS: 100
    skills:
      shield_block:
        effectiveness: 0.45
        cooldown: 3
      stunTicks: 0
    world:
      coins:
        dropChance: 0.5
    explorer:
      lives: 5
  gym/main:
    monsters:
      global:
        speed: 1
      spawn:
        floorPerMonster: 35
    world:
      size:
        min: 37
